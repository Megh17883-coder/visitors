<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visitor Profiles &bull; Administration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b111e;
      --surface: #131c2e;
      --surface-subtle: #19243a;
      --surface-hover: #1f2d48;
      --border: #23314d;
      --border-focus: #3b82f6;
      --text: #f1f5f9;
      --text-muted: #8b9bb4;
      --text-subtle: #62728d;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
      --danger-surface: rgba(239, 68, 68, 0.12);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
      line-height: 1.5;
      min-height: 100vh;
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .title-area h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .title-area p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .nav-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--surface-subtle);
      border-color: var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: var(--surface-hover);
    }

    .btn-danger {
      background: var(--danger-surface);
      border-color: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.2);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text);
      margin-bottom: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
      align-items: flex-end;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }

    input:focus {
      border-color: var(--border-focus);
    }

    #status {
      margin-top: 12px;
      font-size: 13px;
      color: #93c5fd;
    }

    .table-wrap {
      overflow-x: auto;
      margin-top: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
      font-size: 13px;
    }

    th {
      text-align: left;
      padding: 10px 12px;
      color: var(--text-muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    .muted {
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top-bar">
      <div class="title-area">
        <h1>Visitor Profiles</h1>
        <p>Manage registered profiles and linked photo directories</p>
      </div>
      <nav class="nav-actions">
        <a class="btn btn-secondary" href="/admin">Back to Dashboard</a>
        <a class="btn btn-secondary" href="/qr" target="_blank">Common QR</a>
      </nav>
    </header>

    <section class="card">
      <h2>Register Profile</h2>
      <form id="create-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="name">Visitor Full Name</label>
            <input id="name" required minlength="2" maxlength="100" placeholder="e.g. Rahul Patel">
          </div>
          <div class="form-group">
            <label for="phone">Mobile Number (10 digits)</label>
            <input id="phone" required inputmode="numeric" maxlength="10" pattern="[0-9]{10}" placeholder="9876543210">
          </div>
          <div>
            <button class="btn btn-primary" style="padding: 11px 16px; width: 100%;" type="submit">Add Profile</button>
          </div>
        </div>
      </form>
      <div id="status"></div>
    </section>

    <section class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Registered Directory</h2>
        <button class="btn btn-secondary" style="padding: 5px 12px; font-size: 12px;" onclick="loadProfiles()">Refresh</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Mobile</th>
              <th>Saved Photos</th>
              <th>Last Visit</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="5" class="muted">Loading profiles...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    const statusEl = document.getElementById('status');

    async function loadProfiles() {
      const rows = document.getElementById('rows');
      rows.innerHTML = '<tr><td colspan="5" class="muted">Loading profiles...</td></tr>';
      try {
        const r = await fetch('/api/admin/profiles');
        const d = await r.json();
        if (!d.success) throw Error(d.message || 'Failed');
        if (!d.profiles.length) {
          rows.innerHTML = '<tr><td colspan="5" class="muted">No visitor profiles registered yet.</td></tr>';
          return;
        }
        rows.innerHTML = '';
        d.profiles.forEach(p => {
          const tr = document.createElement('tr');
          const name = document.createElement('td');
          name.textContent = p.name;
          const phone = document.createElement('td');
          phone.textContent = p.phone;
          const count = document.createElement('td');
          count.textContent = p.photoCount;
          const date = document.createElement('td');
          date.textContent = p.registeredAt ? new Date(p.registeredAt).toLocaleString() : '—';
          
          const actions = document.createElement('td');
          actions.className = 'actions';
          
          const edit = document.createElement('button');
          edit.className = 'btn btn-secondary';
          edit.style.padding = '4px 10px';
          edit.style.fontSize = '12px';
          edit.textContent = 'Edit';
          edit.onclick = () => editProfile(p);
          
          const del = document.createElement('button');
          del.className = 'btn btn-danger';
          del.style.padding = '4px 10px';
          del.style.fontSize = '12px';
          del.textContent = 'Delete';
          del.onclick = () => deleteProfile(p);
          
          actions.append(edit, del);
          tr.append(name, phone, count, date, actions);
          rows.appendChild(tr);
        });
      } catch (e) {
        rows.innerHTML = '<tr><td colspan="5" class="muted">Could not load profiles. Check server connection.</td></tr>';
      }
    }

    async function editProfile(p) {
      const name = prompt('Update visitor name:', p.name);
      if (name === null) return;
      if (name.trim().length < 2) return alert('Name must be at least 2 characters.');
      try {
        const r = await fetch('/api/admin/profiles/' + encodeURIComponent(p.phone), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name.trim() })
        });
        const d = await r.json();
        if (!r.ok || !d.success) throw Error(d.message || 'Update failed');
        statusEl.textContent = d.message;
        loadProfiles();
      } catch (e) {
        alert(e.message);
      }
    }

    async function deleteProfile(p) {
      if (!confirm(`Delete profile for ${p.name} (${p.phone})? This removes profile references and tokens.`)) return;
      try {
        const r = await fetch('/api/admin/profiles/' + encodeURIComponent(p.phone), {
          method: 'DELETE'
        });
        const d = await r.json();
        if (!r.ok || !d.success) throw Error(d.message || 'Delete failed');
        statusEl.textContent = d.message;
        loadProfiles();
      } catch (e) {
        alert(e.message);
      }
    }

    document.getElementById('create-form').addEventListener('submit', async e => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      try {
        const r = await fetch('/api/visitor/register-profile', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone })
        });
        const d = await r.json();
        if (!r.ok || !d.success) throw Error(d.message || 'Registration failed');
        statusEl.textContent = 'Visitor profile registered successfully.';
        e.target.reset();
        loadProfiles();
      } catch (err) {
        statusEl.textContent = err.message;
      }
    });

    loadProfiles();
  </script>
</body>
</html>
