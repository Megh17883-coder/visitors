<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart TV Display</title>
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Bundled Socket.io client -->
  <script src="socket.io.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070a11;
      --overlay-bg: rgba(9, 14, 24, 0.78);
      --glass-surface: rgba(15, 23, 42, 0.7);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --accent: #38bdf8;
      --success: #10b981;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Slide Stage */
    #stage-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }

    .slide-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center center;
      opacity: 0;
      transition: opacity 1.8s ease-in-out;
      transform: scale(1.0);
    }

    .slide-layer.active {
      opacity: 1;
      animation: ambientKenBurns 18s infinite alternate ease-in-out;
    }

    @keyframes ambientKenBurns {
      0% {
        transform: scale(1.0) translate(0, 0);
      }
      100% {
        transform: scale(1.05) translate(-0.8%, -0.6%);
      }
    }

    /* Natural Cinematic Vignette */
    .vignette-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(7, 10, 17, 0.15) 35%, rgba(7, 10, 17, 0.8) 100%),
                  linear-gradient(to top, rgba(7, 10, 17, 0.85) 0%, transparent 35%),
                  linear-gradient(to bottom, rgba(7, 10, 17, 0.75) 0%, transparent 25%);
      z-index: 2;
      pointer-events: none;
    }

    /* Header Bar */
    .tv-header {
      position: absolute;
      top: 48px;
      left: 64px;
      right: 64px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .residence-branding {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--glass-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 10px 22px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
    }

    .residence-branding .brand-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #93c5fd;
    }

    .residence-branding .title {
      font-size: 16px;
      letter-spacing: 0.05em;
      color: var(--text-main);
      font-weight: 600;
      text-transform: uppercase;
    }

    .tv-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.35);
      padding: 4px 12px;
      border-radius: 20px;
      margin-left: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tv-badge .dot {
      width: 7px;
      height: 7px;
      background: var(--success);
      border-radius: 50%;
    }

    .clock-widget {
      text-align: right;
      background: var(--glass-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 8px 24px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .clock-widget .time {
      font-size: 22px;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: 0.02em;
    }

    .clock-widget .date {
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* Ambient Bottom Caption */
    .ambient-caption {
      position: absolute;
      bottom: 56px;
      left: 64px;
      z-index: 10;
      background: var(--glass-surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 14px 24px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      max-width: 500px;
    }

    .ambient-caption h3 {
      font-size: 16px;
      color: var(--text-main);
      font-weight: 600;
    }

    .ambient-caption p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* ==============================================================
       PRIORITY WELCOME TAKEOVER (5 MINUTES)
       ============================================================== */
    #priority-takeover {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      display: none;
      opacity: 0;
      transition: opacity 1.2s ease;
      background: var(--overlay-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    #priority-takeover.active {
      display: flex;
      opacity: 1;
    }

    .priority-layout {
      width: 100%;
      height: 100%;
      display: flex;
      padding: 100px 110px 80px;
      gap: 72px;
      align-items: center;
      position: relative;
    }

    /* Left: Curated Photo Stage */
    .priority-photo-container {
      flex: 1.15;
      height: 760px;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
    }

    .priority-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.8s ease;
      display: block;
    }

    .photo-count-pill {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(11, 17, 30, 0.8);
      backdrop-filter: blur(10px);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Right: Guest Welcome Info */
    .priority-info-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 24px;
    }

    .tag-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 16px;
      border-radius: 999px;
      width: fit-content;
    }

    .tag-badge span {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #93c5fd;
      font-weight: 600;
    }

    .visitor-greeting-title {
      font-size: 38px;
      font-weight: 400;
      line-height: 1.25;
      color: var(--text-muted);
      letter-spacing: -0.01em;
    }

    .visitor-name-highlight {
      display: block;
      margin-top: 10px;
      font-size: 58px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .visitor-subtext {
      font-size: 20px;
      line-height: 1.6;
      color: var(--text-muted);
      font-weight: 400;
      max-width: 580px;
    }

    /* Countdown Indicator */
    .timer-container {
      margin-top: 16px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px 20px;
      border-radius: 14px;
      width: 100%;
      max-width: 480px;
    }

    .timer-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .timer-header .remaining {
      color: var(--text-main);
      font-weight: 600;
    }

    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 100%;
      background: #3b82f6;
      border-radius: 999px;
      transition: width 1s linear;
    }

    /* Realtime Notification Toast */
    #broadcast-toast {
      position: absolute;
      top: 110px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 16px 36px;
      font-size: 24px;
      font-weight: 600;
      color: #ffffff;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: all 0.5s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #broadcast-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Ambient Photo Slide Layers -->
  <div id="stage-container">
    <div id="layer-a" class="slide-layer active"></div>
    <div id="layer-b" class="slide-layer"></div>
  </div>

  <div class="vignette-overlay"></div>

  <!-- TV Top Navigation -->
  <header class="tv-header">
    <div class="residence-branding">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>
      <span class="title" id="residence-title">Patel Residence</span>
      <div class="tv-badge">
        <div class="dot"></div>
        <span id="tv-name-tag">Display 1</span>
      </div>
    </div>

    <div class="clock-widget">
      <span class="time" id="clock-time">12:00 PM</span>
      <span class="date" id="clock-date">November 25, 2026</span>
    </div>
  </header>

  <!-- Ambient Slide Caption -->
  <div class="ambient-caption" id="ambient-caption">
    <h3 id="caption-title">Residence Gallery</h3>
    <p id="caption-sub">Ambient Mode</p>
  </div>

  <!-- Priority Welcome Takeover -->
  <div id="priority-takeover">
    <div class="priority-layout">
      <!-- Left Photo Carousel -->
      <div class="priority-photo-container">
        <img id="priority-img" class="priority-photo" src="" alt="Visitor Photo">
        <div class="photo-count-pill" id="photo-count">1 of 1</div>
      </div>

      <!-- Right Announcement Details -->
      <div class="priority-info-container">
        <div class="tag-badge">
          <span>Guest Arrival</span>
        </div>

        <h1 class="visitor-greeting-title">
          Welcome to our residence,
          <span class="visitor-name-highlight" id="visitor-name">Guest</span>
        </h1>

        <p class="visitor-subtext" id="visitor-greeting-sub">
          We are delighted to welcome you to our home today.
        </p>

        <!-- 5-Minute Countdown -->
        <div class="timer-container">
          <div class="timer-header">
            <span>Welcome Display</span>
            <span class="remaining" id="countdown-text">05:00 Remaining</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Urgent Broadcast Message Toast -->
  <div id="broadcast-toast">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
    </svg>
    <span id="broadcast-text">Notification</span>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const tvId = urlParams.get('tvId') || 'tv1';

    const tvNames = {
      tv1: 'Living Room TV (1)',
      tv2: 'Dining Hall TV (2)',
      tv3: 'Lounge TV (3)'
    };
    document.getElementById('tv-name-tag').innerText = tvNames[tvId] || `Smart TV (${tvId})`;

    let ambientPhotos = [];
    let currentAmbientIndex = 0;
    let activeLayer = 'a';
    let ambientTimer = null;
    let priorityWelcomeTimer = null;
    let countdownInterval = null;
    let currentMode = 'ambient';

    let priorityVisitor = null;
    let priorityPhotoIndex = 0;
    let priorityRotationTimer = null;
    let prioritySecondsRemaining = 300;
    let priorityTotalSeconds = 300;

    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const dateStr = now.toLocaleDateString([], { month: 'long', day: 'numeric', year: 'numeric' });
      document.getElementById('clock-time').innerText = timeStr;
      document.getElementById('clock-date').innerText = dateStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function playWelcomeChime() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.05 + (i * 0.15));
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2 + (i * 0.15));
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + (i * 0.15));
          osc.stop(audioCtx.currentTime + 1.5 + (i * 0.15));
        });
      } catch (e) {
        console.log('Audio chime not available or muted:', e);
      }
    }

    const SERVER_URL = (window.location.protocol.startsWith('http') && window.location.port === '5000')
      ? ''
      : 'http://localhost:5000';

    function getFullPhotoUrl(url) {
      if (!url) return '';
      if (url.startsWith('http')) return url;
      return SERVER_URL + url;
    }

    async function fetchAmbientPhotos() {
      try {
        const res = await fetch(SERVER_URL + '/api/photos/ambient');
        const data = await res.json();
        if (data.success && data.photos.length > 0) {
          ambientPhotos = data.photos;
          if (currentMode === 'ambient') {
            displayNextAmbientSlide();
          }
        }
      } catch (err) {
        console.error('Failed to fetch ambient photos:', err);
      }
    }

    function displayNextAmbientSlide() {
      if (ambientPhotos.length === 0 || currentMode !== 'ambient') return;

      const photo = ambientPhotos[currentAmbientIndex];
      const nextLayer = activeLayer === 'a' ? 'b' : 'a';
      const curElem = document.getElementById(`layer-${activeLayer}`);
      const nextElem = document.getElementById(`layer-${nextLayer}`);

      nextElem.style.backgroundImage = `url('${getFullPhotoUrl(photo.url)}')`;
      nextElem.classList.add('active');
      curElem.classList.remove('active');

      activeLayer = nextLayer;
      document.getElementById('caption-title').innerText = photo.title || 'Patel Residence';
      document.getElementById('caption-sub').innerText = 'Ambient Slideshow';

      currentAmbientIndex = (currentAmbientIndex + 1) % ambientPhotos.length;
    }

    function startAmbientRotation() {
      if (ambientTimer) clearInterval(ambientTimer);
      ambientTimer = setInterval(displayNextAmbientSlide, 9000);
      displayNextAmbientSlide();
    }

    function triggerPriorityWelcome(data) {
      console.log('Received Priority Welcome:', data);
      currentMode = 'priority_welcome';
      priorityVisitor = data;
      priorityTotalSeconds = data.durationSeconds || 300;
      prioritySecondsRemaining = priorityTotalSeconds;
      priorityPhotoIndex = 0;

      playWelcomeChime();

      document.getElementById('visitor-name').innerText = data.name || 'Honored Guest';
      document.getElementById('residence-title').innerText = (data.residenceName || 'Patel Residence');
      
      const takeoverElem = document.getElementById('priority-takeover');
      takeoverElem.classList.add('active');

      showPriorityPhoto();
      if (priorityRotationTimer) clearInterval(priorityRotationTimer);
      if (data.photos && data.photos.length > 1) {
        priorityRotationTimer = setInterval(showNextPriorityPhoto, 7000);
      }

      if (countdownInterval) clearInterval(countdownInterval);
      updateCountdownDisplay();
      countdownInterval = setInterval(() => {
        prioritySecondsRemaining--;
        updateCountdownDisplay();

        if (prioritySecondsRemaining <= 0) {
          endPriorityWelcome();
        }
      }, 1000);
    }

    function showPriorityPhoto() {
      const photos = priorityVisitor.photos || [];
      const imgElem = document.getElementById('priority-img');
      const countElem = document.getElementById('photo-count');

      if (photos.length > 0) {
        imgElem.src = getFullPhotoUrl(photos[priorityPhotoIndex]);
        countElem.innerText = `${priorityPhotoIndex + 1} of ${photos.length}`;
      } else {
        imgElem.src = 'https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&w=1200&q=80';
        countElem.innerText = 'Welcome';
      }
    }

    function showNextPriorityPhoto() {
      const photos = priorityVisitor.photos || [];
      if (photos.length <= 1) return;
      priorityPhotoIndex = (priorityPhotoIndex + 1) % photos.length;
      showPriorityPhoto();
    }

    function updateCountdownDisplay() {
      const mins = Math.floor(prioritySecondsRemaining / 60);
      const secs = prioritySecondsRemaining % 60;
      const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      document.getElementById('countdown-text').innerText = `${formatted} Remaining`;

      const pct = (prioritySecondsRemaining / priorityTotalSeconds) * 100;
      document.getElementById('progress-fill').style.width = `${pct}%`;
    }

    function endPriorityWelcome() {
      console.log('Priority welcome finished. Transitioning back to ambient mode.');
      if (countdownInterval) clearInterval(countdownInterval);
      if (priorityRotationTimer) clearInterval(priorityRotationTimer);

      const takeoverElem = document.getElementById('priority-takeover');
      takeoverElem.classList.remove('active');
      currentMode = 'ambient';

      fetchAmbientPhotos();
      startAmbientRotation();
    }

    function showBroadcastToast(msg, durationSecs) {
      const toast = document.getElementById('broadcast-toast');
      document.getElementById('broadcast-text').innerText = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, (durationSecs || 15) * 1000);
    }

    const socket = io(SERVER_URL || undefined);

    socket.on('connect', () => {
      console.log('Connected to Central Sync Hub');
      socket.emit('REGISTER_TV', { tvId: tvId });
    });

    setInterval(() => {
      if (socket.connected) {
        socket.emit('TV_HEARTBEAT', { tvId: tvId, currentMode: currentMode });
      }
    }, 10000);

    socket.on('TRIGGER_WELCOME_SHOW', (data) => {
      triggerPriorityWelcome(data);
    });

    socket.on('BROADCAST_MESSAGE', (data) => {
      showBroadcastToast(data.message, data.durationSeconds);
    });

    socket.on('AMBIENT_PHOTOS_UPDATED', (photos) => {
      ambientPhotos = photos;
    });

    fetchAmbientPhotos().then(() => {
      startAmbientRotation();
    });
  </script>
</body>
</html>
